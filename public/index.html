role:"SMA 線長",tag:"SMA",color:"#b0702a",about:"MLB 線的線長。打板順序改三次，她會罵三次，然後照做。"},wh:{name:"胖虎",role:"成品倉管",tag:"倉管",color:"#3a7a6a",about:"成品倉。系統上的數字跟架上的數字，他都背得出來。"},brk:{name:"報關行",role:"電話",tag:"電話",color:"#55616b",about:"幫你把機台送出國門的人，對 HS code 特別敏感。"},rd:{name:"Kevin",role:"Camera RD",tag:"RD",color:"#2a7a8a",about:"RD 單位的工程師。每台 Rel 候選機他都有意見，而且意見每天不一樣。"},aae:{name:"AAE",role:"電話",tag:"AAE",color:"#55616b",about:"負責新料導入的工程師。新到料能不能投，要先過他這關。"},eol:{name:"線尾倉",role:"訊息",tag:"線尾倉",color:"#55616b",about:"產線最後一站旁邊的倉。OK2REL 的機台先到這裡，再被領走。"},oqc:{name:"晚班 OQC",role:"電話",tag:"OQC",color:"#55616b",about:"晚班只有一個人的出貨檢驗站。"},roomie:{name:"阿凱",role:"室友・別的專案的 PE",tag:"室友",color:"#8a5a9a",about:"宿舍的室友。每天十點準時打遊戲，十一點準時問你「你還在回群組喔？」"}};WORLD.cast={me:{label:"你・EPM",fill:"#f2b01e",ink:"#231800",cloth:3881787,color:13208064,hair:2827040,node:"a2",face:0},cmd:{label:"小芸・Commodity",fill:"#b8452f",ink:"#ffffff",cloth:8010282,color:12076335,hair:3810328,long:!0,node:"d_cmd",face:0},asm:{label:"阿哲・Assembly",fill:"#2b6bd6",ink:"#ffffff",cloth:3100559,color:2845654,hair:1842204,node:"d_asm",face:0},tst:{label:"佩佩・Testing",fill:"#7a3fb0",ink:"#ffffff",cloth:5913210,color:8011696,hair:2824722,long:!0,node:"d_tst",face:0},shp:{label:"大衛・Shipping",fill:"#1f8a5b",ink:"#ffffff",cloth:3107402,color:2067035,hair:2763306,node:"d_shp",face:0},mlb:{label:"Ken・MLB",fill:"#c06a12",ink:"#ffffff",cloth:6965802,color:12610066,hair:1709072,node:"d_mlb",face:0},boss:{label:"克里夫・Project Lead",fill:"#33454e",ink:"#ffffff",cloth:2767426,color:3360078,hair:5592405,node:"d_boss",face:0},f1:{label:"蝦倫・F1",fill:"#d03a6a",ink:"#ffffff",cloth:15658734,color:13646442,hair:4860442,long:!0,node:"f1d",face:0},f1b:{label:"Y陳・F1 EPS",fill:"#c0446e",ink:"#ffffff",cloth:15132390,color:12600430,hair:1842204,node:"f1e",face:0},opm1:{label:"卡蜜兒・OPM",fill:"#4a7a8a",ink:"#ffffff",cloth:14209248,color:4881034,hair:6961690,long:!0,node:"opm1",face:0},opm2:{label:"Dr.・OPM",fill:"#3a5a6a",ink:"#ffffff",cloth:3816010,color:3824234,hair:907943 從庫存裡挑出符合需求（config、序號）的機台。"],["報關","機台出口前要向海關申報：品名、數量、HS code。"],["HS code","海關用的商品分類編號。打錯一碼，貨就可能卡在海關。"],["candidates","明天可能出貨的機台名單。"],["MLB","主板（Main Logic Board）。"],["SMA","主板打件：把零件貼到電路板上（遊戲裡的叫法）。"],["BM","主板上需要另外處理的關鍵料（遊戲裡簡化的叫法）。BM stuffing 是把它裝上去。"],["DOE","實驗設計：刻意改一些條件做一批，看結果差多少。"],["lockdown","把明天的生產計畫定下來，不再改。"],["config","同一個產品的不同配置，例如容量、顏色。"],["ETA","預計到達的時間。"],["DRI","這件事的負責人（Directly Responsible Individual）。出事了，大家第一個找他。"],["Test rule","測試規則：每一站要測什麼、門檻多少、哪些工單照哪一版跑。客戶一改，它就跟著改。"],["iMessage","客戶常用的即時訊息。半夜也會亮。"],["Offline","從產線抽出來、送到實驗室（lab）做額外測試的機台。"],["DOE list","客戶要做的所有實驗清單：每一組要幾台、什麼條件、什麼時候要。"],["追蹤表","EPM 自己維護的進度表：每台 offline 機台在哪間 lab、測到哪、卡在哪。"],["借機 / 借機單","各單位把專案的機台借去做驗證，要先提單，用完要還。"],["簽修","機台要修，先簽進維修站。"],["轉帳","機台在系統上換帳，例如從 offline 轉回成品倉。"],["WIP","這裡指一次 build 正在進行的期間。快結束時，build 後要用的機台要先安排好。"],["Mini build","正式量產前的小量試產。"],["原始數據","測試機台吐出來、還沒整理過的每一筆量測值。"],["Rel tracker","Rel 候選機台的追蹤表：每台要做哪一項 Rel、RD 有沒有意見、什麼時候送。"],["Rel","可靠度測試（Reliability）：把機台拿去摔、泡、烤、長時間跑，看它撐不撐得住。"],["OK2REL","確認這台可以送去做 Rel 了。"],["GK","測試流程裡的一站（遊戲裡的叫法）。測完 GK 的機台，才有資格當 Rel 候選。"],["RD","研發單位。每個 RD 團隊都想要自己的機台，也都有自己的意見。"],["線尾倉","產線最後一站旁邊的倉，機台在這裡等著被送去下一個地方。"],["送修","機台壞了，送去維修站修。"],["AAE","負責新料導入與驗證的工程師（遊戲裡的叫法）。"],["FC","新到料上線前的確認結果（遊戲裡的叫法）。"],["fit check","新料裝上去之前，先試裝看看尺寸、卡扣合不合。"],["sorting","把一批料一顆一顆挑過，把有問題的挑出來。"],["Sub","先組好、再拿去上主線的半成品（sub-assembly）。"],["Build Matrix","這次 build 每一種 config 要做幾台、用哪些料的總表。"],["Long Term CTB","看好幾週以後的 CTB：哪些料現在不追，到時候就會缺。"],["Rel CTB","要做 Rel 的機台，料夠不夠的那一張 CTB。"],["stuffing","把料裝上主板或機台。"],["DOE Tracker","每一組 DOE 實驗的進度表：料到了沒、做了幾台、測到哪。"],["URS","借機或用機的需求單（遊戲裡的叫法）：誰要、要幾台、什麼 config。"],["loan","借出去的機台。借出去的，總有一天要還。"],["OQC","出貨前的最後一道檢驗。沒過 OQC，機台就出不了門。"],["包裝明細","每一箱裝了哪些序號的清單。報關、出貨都要照它。"],["F1 EPS","客戶那邊管出貨與機台需求的窗口（遊戲裡的叫法）。"],["訊小通","廠內常用的通訊軟體（遊戲裡的叫法）。半夜也會亮。"],["通宵","一整晚沒睡。"],["OPM","工廠這邊管營運的專案經理（Operations Program Manager）。不是客戶，有自己的辦公室。"],["Project Lead","整個專案的負責人，比 FATP Lead 還大。"],["門禁","宿舍晚上鎖門的時間。"],["金屬探測門","進產線前要過的門。手機、鑰匙、零錢，一樣都帶不進去。"],["靜電服","產線裡穿的橘色防靜電衣服，免得身上的靜電打壞
